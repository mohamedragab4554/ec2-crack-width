[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ec2crack"
version = "1.0.0"
description = "Transparent crack-width and crack-control checks to EN 1992-1-1 7.3 and EN 1992-3 (liquid-retaining structures)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Ragab" }]
keywords = ["eurocode 2", "EN 1992", "crack width", "serviceability", "reinforced concrete", "structural engineering"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "structuralcodes>=0.5", "matplotlib>=3.8"]

[project.scripts]
ec2crack = "ec2crack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E702"]
